[project]
name = "nowearnow"
version = "0.1.0"
description = "Privacy-first lost-property labels for families"
requires-python = ">=3.12,<3.13"
dependencies = ["Django>=5.2,<5.3", "djangorestframework>=3.16,<4", "qrcode>=8.2,<9"]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
